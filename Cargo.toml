[package]
name = "jj-code-review"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
two-face = { version = "0.5.2", features = ["syntect-default-onig"] }

[[bin]]
name = "jcr"
path = "src/main.rs"
