[package]
name = "jj-code-review"
version = "0.2.0"
edition = "2024"
description = "TUI code review for Jujutsu diffs, callable by agents"
license = "MIT"
authors = ["Nicolas Chagnet <nchagnet@protonmail.com>"]
repository = "https://github.com/NicolasChagnet/jj-code-review"
readme = "README.md"
keywords = ["jujutsu", "jj", "code-review", "tui", "diff"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
two-face = { version = "0.5.2", features = ["syntect-default-onig"] }

[[bin]]
name = "jcr"
path = "src/main.rs"

# Our release archives are named after the binary (`jcr-<tag>-<target>.tar.gz`)
# and contain a single top-level dir, neither of which cargo-binstall's default
# heuristics can infer from the crate name `jj-code-review`.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/jcr-v{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "jcr-v{ version }-{ target }/{ bin }{ binary-ext }"
